[project]
name = "koeuchi"
version = "0.1.0"
description = "Japanese push-to-talk voice input with local ASR. Copies the transcription to the clipboard (optional auto-paste)"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "mlx-audio[stt]>=0.4.6",
    "sounddevice>=0.5.5",
    "pynput>=1.8.2",
    "pyobjc-framework-Quartz>=12.2.1",
    "pyobjc-framework-Cocoa>=12.2.1",
    "numpy>=1.26",
]

[project.scripts]
koeuchi = "koeuchi.app:main"

[tool.uv]
exclude-newer = "30 days"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/koeuchi"]
